name: openlist-setting-list

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: Fetch /api/admin/setting/list with fresh guest token
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, json, os
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, token=None, body=None):
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode(); h['Content-Type']='application/json'
              req=urllib.request.Request(base+path, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          s,b=fetch('POST','/api/auth/login', body={"username":"guest","password":"guest"})
          j=json.loads(b)
          tok=j.get('data',{}).get('token')
          print("guest login:", s, "token?", bool(tok))
          s2,b2=fetch('GET','/api/admin/setting/list', token=tok)
          ad=b2.decode('utf-8','replace')
          print("=== /api/admin/setting/list status=%s len=%d ===" % (s2, len(ad)))
          print("=== FULL BODY START ===")
          print(ad)
          print("=== FULL BODY END ===")
          try:
              jj=json.loads(ad)
              if isinstance(jj,dict):
                  print("=== TOP KEYS ===", list(jj.keys()))
                  d=jj.get('data')
                  if isinstance(d,dict):
                      print("=== data KEYS (%d) ===" % len(d))
                      for k,v in d.items():
                          print("data.%s = %s" % (k, str(v)[:300]))
                  elif isinstance(d,list):
                      print("=== data is LIST len=%d ===" % len(d))
                      for it in d[:5]:
                          if isinstance(it,dict): print("item keys:", list(it.keys())[:20])
          except Exception as e:
              print("parse err", e)
          print("DONE")
          PYEOF
