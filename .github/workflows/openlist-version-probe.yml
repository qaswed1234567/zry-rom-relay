name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version probe v5 (context + about + entries)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':UA})
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          def ctx_of(text, kw, before=60, after=80, limit=8):
              out=[]
              for m in re.finditer(re.escape(kw), text):
                  out.append(text[max(0,m.start()-before):m.start()+after].replace('\n',' '))
                  if len(out)>=limit: break
              return out

          # fetch entry + libs
          chunks={'index':'/assets/index-PvGPvlUv.js','lib':'/assets/lib-fvlc89Ul.js',
                  'store':'/assets/store-BxFvGRq4.js','tb':'/assets/tb-RbDNyT4E.js',
                  'components':'/assets/components-CV7_am9F.js'}
          txts={}
          for name,url in chunks.items():
              s,b=fetch(url)
              txts[name]=b.decode('utf-8','replace')
              print("FETCHED %s status=%s len=%d" % (url,s,len(b)))

          allt='\n'.join(txts.values())

          print("\n=== context around '3.49.0' ===")
          for c in ctx_of(allt,'3.49.0',40,90,6): print("  %r"%c)
          print("\n=== context around '2.0.0' (plugin) ===")
          for c in ctx_of(allt,'OpenListPlugin={version',20,120,3): print("  %r"%c)
          print("\n=== 'VERSION=' context ===")
          for c in ctx_of(allt,'VERSION=',30,80,5): print("  %r"%c)

          # About-page mechanism: search for 'About' + version, and how app version is obtained
          print("\n=== 'about' / 'About' near version ===")
          for m in re.finditer(r'.{0,40}(?:about|About|鍏充簬).{0,40}version.{0,40}', allt, re.I):
              print("  %r"%m.group(0)[:140])
          # grep for getversion / app version fetch
          for kw in ['getVersion','appVersion','versionInfo','fetchVersion','/api/version','version:import.meta','import.meta.env','buildVersion','app_version','site_version']:
              ms=ctx_of(allt, kw, 20, 60, 2)
              if ms:
                  print("  [%s]: %s" % (kw, ms))

          # The OpenList 'About' page in frontend typically references a constant like
          # const version = "x.y.z" OR reads from backend. Search for t.version assignments in About components
          print("\n=== explicit version constants (X.Y.Z inside backticks near 'version') ===")
          for m in re.finditer(r'(?:version|Version|VERSION)\D{0,12}?[`"\'](\d+\.\d+\.\d+(?:[-+][^`"\']+)?)[`"\']', allt):
              print("  %r" % allt[max(0,m.start()-30):m.end()+10].replace('\n',' '))

          # any 4-segment or 'v' prefixed version like v4.0.0, v3.x
          print("\n=== 'vX.Y.Z' literals ===")
          for m in re.finditer(r'v\d+\.\d+\.\d+', allt):
              print("  %r"%allt[max(0,m.start()-20):m.end()+10].replace('\n',' '))
          print("\nDONE")
          PYEOF
