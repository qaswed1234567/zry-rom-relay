name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version fingerprint (read-only, deep)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json, hashlib, base64
          from urllib.parse import urljoin
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, body=None, token=None):
              url=base+path
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':base,'Referer':base+'/'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, dict(r.getheaders()), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return -1, {}, ('ERR:'+repr(e)).encode()
          def jd(b):
              try: return json.loads(b.decode('utf-8','replace'))
              except: return None
          def sha(b): return hashlib.sha256(b).hexdigest()

          print("========== TARGET: %s ==========" % base)
          os.makedirs('out', exist_ok=True)

          # FULL index page
          s,h,b=fetch('GET','/')
          txt=b.decode('utf-8','replace')
          open('out/index.html','w',encoding='utf-8').write(txt)
          print("INDEX status=%s len=%d" % (s,len(b)))

          # ALL asset refs (scripts, module scripts, stylesheets, preload, links)
          refs=[]
          for m in re.finditer(r'(?:src|href)\s*=\s*["\']([^"\']+)["\']', txt, re.I):
              refs.append(m.group(1))
          # also type=module + crossorigin patterns
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)', txt, re.I):
              if m.group(1) not in refs: refs.append(m.group(1))
          print("ALL_REFS(%d):" % len(refs))
          for r in sorted(set(refs)): print("  %s" % r)

          # fetch every ref
          alljs=bytearray()
          for i,r in enumerate(sorted(set(refs))):
              u=urljoin(base+"/", r)
              s2,h2,b2=fetch('GET', u.replace(base,''))
              if s2>=400 or not b2:
                  print("  SKIP %s (status=%s len=%s)" % (u,s2,len(b2))); continue
              fn='out/asset_%02d%s' % (i, os.path.splitext(r)[1] or '.bin')
              open(fn,'wb').write(b2)
              if r.lower().endswith('.js'): alljs+=b2
              print("  [%d] %s status=%s sha256=%s len=%d" % (i,u,s2,sha(b2)[:16],len(b2)))

          # FULL public settings (version may hide here? unlikely, but dump)
          s3,h3,b3=fetch('GET','/api/public/settings')
          d3=jd(b3)
          print("\n===== PUBLIC SETTINGS keys =====")
          if d3: print("  %s" % list(d3.get('data',{}).keys()))
          # look for any version-ish value
          if d3:
              for k,v in d3.get('data',{}).items():
                  vs=str(v)
                  if re.search(r'\d+\.\d+', vs) and len(vs)<60:
                      print("  setting %s=%r" % (k,v))

          # BROAD version grep on concatenated JS
          jst=alljs.decode('utf-8','replace')
          print("\n===== BROAD VERSION GREP (all JS, %d bytes) =====" % len(jst))
          seen=set()
          for m in re.findall(r'(?i)(?:openlist|alist|version|ver|vite|build|commit|hash|release)[^a-z0-9]{0,3}["\']?[:=]?\s*["\']?v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?', jst):
              seen.add(m)
          for m in re.findall(r'\b\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?\b', jst):
              seen.add(m)
          print("CANDIDATE_VERSIONS:")
          for v in sorted(seen)[:80]: print("  %s" % v)
          # brand strings
          for brand in ['OpenList','openlist','Alist','alist','oplist','VITE','RENDER_VERSION','window.__']:
              cnt=jst.count(brand)
              if cnt: print("  brand[%s] count=%d sample=%r" % (brand,cnt, (jst.find(brand)>=0 and jst[max(0,jst.find(brand)-20):jst.find(brand)+60])))
          # explicit __VERSION__ / define injections
          for m in re.findall(r'(window\.[A-Za-z_]+|globalThis\.[A-Za-z_]+)\s*=\s*["\'][^"\']{1,40}["\']', jst)[:0]:
              print("  GLOBAL %s" % m)
          # look for env-style version define
          for m in re.findall(r'([A-Z_]{4,})\s*=\s*["\']([0-9][^"\']{0,30})["\']', jst)[:40]:
              print("  DEFINE %s=%s" % m)

          print("\n===== DONE =====")
          PYEOF
