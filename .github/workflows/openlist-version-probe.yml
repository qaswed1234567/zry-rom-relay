name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version fingerprint v3 (raw inspection)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json, hashlib
          from urllib.parse import urljoin
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, body=None, token=None):
              url=base+path
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':base,'Referer':base+'/'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, dict(r.getheaders()), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return -1, {}, ('ERR:'+repr(e)).encode()
          def jd(b):
              try: return json.loads(b.decode('utf-8','replace'))
              except: return None

          print("========== TARGET: %s ==========" % base)
          os.makedirs('out', exist_ok=True)

          # raw index
          s,h,b=fetch('GET','/')
          txt=b.decode('utf-8','replace')
          print("\n===== RAW INDEX (len=%d) =====" % len(b))
          print(txt)
          open('out/index.html','w',encoding='utf-8').write(txt)

          # manifest
          s2,h2,b2=fetch('GET','/manifest.json')
          print("\n===== manifest.json (status=%s) =====" % s2)
          print(b2.decode('utf-8','replace') if s2<400 else "ERR")
          open('out/manifest.json','wb').write(b2)

          # fetch the legacy JS fully
          m=re.search(r'/assets/[^"\']+\.js', txt)
          jsurl=None
          if m:
              jsurl=m.group(0)
              s3,h3,b3=fetch('GET', jsurl)
              print("\n===== JS BUNDLE %s (status=%s len=%d) =====" % (jsurl,s3,len(b3)))
              jst=b3.decode('utf-8','replace')
              open('out/app.js','wb').write(b3)
              # grep meaningful version-ish lines
              for kw in ['ersion','OpenList','openlist','Alist','alist','Oplist','oplist','Build','build','commit','Commit','hash','Hash','Release','release','2024','2025','2026','v3.','v4.','3.11','3.12','4.0','4.1','new OpenList','OpenList v','AList v']:
                  hits=[x for x in jst.split('\n') if kw.lower() in x.lower()]
                  # minified: try to find occurrences with context
                  idxs=[mm.start() for mm in re.finditer(re.escape(kw), jst, re.I)]
                  if idxs:
                      print("  [%s] count=%d sample_contexts:" % (kw,len(idxs)))
                      for i in idxs[:3]:
                          seg=jst[max(0,i-40):i+50].replace('\n',' ')
                          print("     ...%s..." % seg)
          else:
              print("NO JS ref found in index")

          # version endpoint battery
          print("\n===== VERSION ENDPOINT BATTERY =====")
          for ep in ['/api/version','/api/version/','/version','/api/public/version',
                     '/api/admin/setting/version','/api/me','/api/info','/api/site',
                     '/api/setting','/api/admin/setting/list','/api/admin/setting',
                     '/api/healthy','/api/status','/api/ping']:
              s4,h4,b4=fetch('GET', ep)
              ct=h4.get('Content-Type','')
              is_json = 'json' in ct.lower()
              snippet=b4[:200].decode('utf-8','replace')
              print("  %-32s status=%s ct=%s %s" % (ep, s4, ct[:20], (snippet if not is_json or 'doctype' in snippet.lower() else b4.decode('utf-8','replace')[:160])))

          # headers on a real API call 鈥?any version header?
          print("\n===== HEADERS on /api/public/settings =====")
          s5,h5,b5=fetch('GET','/api/public/settings')
          for k in h5: print("  %s: %s" % (k, h5[k]))

          print("\n===== DONE =====")
          PYEOF
