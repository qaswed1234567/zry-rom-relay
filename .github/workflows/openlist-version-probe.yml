name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version source v6 (trace About->endpoint)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':UA})
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # The About component usually lives in components chunk. Fetch it.
          s,b=fetch('/assets/components-CV7_am9F.js')
          allt=b.decode('utf-8','replace')
          print("components len=",len(b))

          # Find how 'version' is obtained in an About-like context:
          # typical: getSetting('version') or api.get('/api/...') then .version
          # Search for 'version' near API call patterns
          print("\n=== 'version' near api/request calls ===")
          for m in re.finditer(r'.{0,30}(?:api|axios|request|get|fetch)\(.{0,60}version.{0,30}', allt, re.I):
              print("  %r"%m.group(0)[:160])
          # Search for a literal endpoint string followed later by version use
          print("\n=== endpoints referencing version in path/query ===")
          for m in re.finditer(r'`(/[^`]*version[^`]*)', allt):
              print("  %r"%m.group(1)[:120])
          for m in re.finditer(r'"/([^"]*version[^"]*)"', allt):
              print("  %r"%m.group(1)[:120])
          for m in re.finditer(r"'(/[^']*version[^']*)'", allt):
              print("  %r"%m.group(1)[:120])

          # The OpenList About page often uses getSetting('version') from public settings.
          print("\n=== 'version' as getSetting/getSettingByKey arg ===")
          for m in re.finditer(r'(?:getSetting|getSystemSetting|getSettingByKey)\([^)]*version[^)]*\)', allt, re.I):
              print("  %r"%m.group(0)[:160])
          # broad: version used as object key in a request/data object
          print("\n=== 'version:' in request/data objects ===")
          cnt=0
          for m in re.finditer(r'\{[^}]{0,40}version:[^}]{0,40}\}', allt):
              print("  %r"%m.group(0)[:160]); cnt+=1
              if cnt>=10: break

          # Also check for '/api/version' exact string anywhere (maybe with different casing built dynamically)
          print("\n=== '/api/version' exact ===")
          print("  found:", '/api/version' in allt)

          # Now probe a battery of candidate backend version endpoints (GET, anon)
          print("\n=== PROBE backend endpoints ===")
          cands=['/api/version','/api/version/','/api/admin/version','/api/admin/setting/version',
                 '/api/public/version','/api/setting/version','/api/about','/api/public/about',
                 '/api/meta','/api/public/meta','/api/build','/version.json','/api/info',
                 '/api/system/version','/api/me/version']
          for ep in cands:
              s2,b2=fetch(ep)
              bo=b2.decode('utf-8','replace')
              if bo and 'doctype' not in bo.lower() and '<html' not in bo.lower():
                  print("  %-32s -> %s : %s" % (ep, s2, bo[:200]))
              else:
                  print("  %-32s -> %s (html/fallback)" % (ep, s2))
          print("\nDONE")
          PYEOF
