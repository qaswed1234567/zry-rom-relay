name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version fingerprint v4 (all JS chunks)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json
          from urllib.parse import urljoin
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, body=None, token=None):
              url=base+path
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':base,'Referer':base+'/'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, dict(r.getheaders()), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return -1, {}, ('ERR:'+repr(e)).encode()

          print("========== TARGET: %s ==========" % base)
          os.makedirs('out', exist_ok=True)
          s,h,b=fetch('GET','/')
          txt=b.decode('utf-8','replace')

          # collect ALL asset URLs from the HTML (preloads + legacy + module entry)
          assets=set()
          for m in re.finditer(r'/(?:assets|brand)/[A-Za-z0-9_.\-]+\.(?:js|css)', txt):
              assets.add(m.group(0))
          # also the module entry script
          for m in re.finditer(r'src="(/assets/[^"]+\.js)"', txt):
              assets.add(m.group(1))
          for m in re.finditer(r'href="(/assets/[^"]+\.css)"', txt):
              assets.add(m.group(1))
          print("ASSETS_FOUND(%d):" % len(assets))
          for a in sorted(assets): print("  %s" % a)

          alljs=bytearray()
          jsmap={}
          for a in sorted(assets):
              if not a.endswith('.js'): continue
              s2,h2,b2=fetch('GET', a)
              if s2>=400 or not b2:
                  print("  SKIP %s status=%s" % (a,s2)); continue
              fn='out'+a.replace('/','_')
              open(fn,'wb').write(b2)
              jsmap[a]=b2.decode('utf-8','replace')
              alljs+=b2
              print("  FETCHED %s len=%d" % (a,len(b2)))

          jst=alljs.decode('utf-8','replace')
          print("\n===== TOTAL JS = %d bytes, %d files =====" % (len(jst), len(jsmap)))

          # 1) any semver anywhere
          semvers=set(re.findall(r'\b\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?\b', jst))
          print("SEMVERS(%d): %s" % (len(semvers), sorted(semvers)))

          # 2) "OpenList" / brand + nearby context
          for brand in ['OpenList','openlist','AList','alist','oplist','Oplist']:
              idxs=[m.start() for m in re.finditer(re.escape(brand), jst)]
              if idxs:
                  print("\n[brand %s] count=%d" % (brand,len(idxs)))
                  for i in idxs[:6]:
                      print("   ...%s..." % jst[max(0,i-50):i+60].replace('\n',' '))

          # 3) import.meta.env / define injected version
          for pat in [r'import\.meta\.env\.[A-Z_]+', r'process\.env\.[A-Z_]+', r'__VERSION__', r'__OPENLIST[A-Z_]*__', r'VERSION\s*[=:]', r'APP_VERSION', r'BUILD_VERSION']:
              ms=set(re.findall(pat, jst))
              if ms:
                  print("\n[%s] -> %s" % (pat, sorted(ms)[:20]))

          # 4) about-page style version rendering: look for "Version" label text
          for m in re.finditer(r'(?:Version|version)\D{0,20}([\w.\-]{3,30})', jst):
              seg=m.group(0)
              if re.search(r'\d', m.group(1)):
                  print("  version-label-ish: %r" % seg[:80])

          print("\n===== DONE =====")
          PYEOF
