name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version source v8 (raw dumps + grep)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, token=None, body=None):
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode(); h['Content-Type']='application/json'
              req=urllib.request.Request(base+path, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # guest login
          s,b=fetch('POST','/api/auth/login', body={"username":"guest","password":"guest"})
          tok=json.loads(b).get('data',{}).get('token')
          print("guest token:", bool(tok))

          os.makedirs('out', exist_ok=True)

          # 1) raw index.html
          s1,h1,b1=fetch('GET','/')
          idx=b1.decode('utf-8','replace')
          open('out/index.html','w').write(idx)
          print("\n=== index.html: lines containing 'version' (ci) ===")
          for ln in idx.split('\n'):
              if 'version' in ln.lower() or 'OPENLIST_CONFIG' in ln or 'OPENLIST' in ln:
                  print("  %s" % ln.strip()[:300])
          # full OPENLIST_CONFIG object
          m=re.search(r'window\.OPENLIST_CONFIG\s*=\s*(\{[^;]*\})', idx, re.S)
          if m: print("\nOPENLIST_CONFIG =", m.group(1)[:600])

          # 2) public settings raw
          s2,h2,b2=fetch('GET','/api/public/settings')
          ps=b2.decode('utf-8','replace')
          open('out/public_settings.json','w').write(ps)
          print("\n=== /api/public/settings: 'version' substrings ===")
          for mm in re.finditer(r'.{0,30}version.{0,40}', ps, re.I):
              print("  %r" % mm.group(0)[:120])

          # 3) admin setting list with guest token
          s3,h3,b3=fetch('GET','/api/admin/setting/list', token=tok)
          ad=b3.decode('utf-8','replace')
          open('out/admin_setting_list.json','w').write(ad)
          print("\n=== /api/admin/setting/list (guest) status=%s len=%d ===" % (s3,len(ad)))
          print("=== version substrings ===")
          for mm in re.finditer(r'.{0,30}version.{0,40}', ad, re.I):
              print("  %r" % mm.group(0)[:120])
          # also find key named version-ish
          try:
              j=json.loads(ad)
              def findver(o, p=''):
                  res=[]
                  if isinstance(o,dict):
                      for k,v in o.items():
                          if 'version' in str(k).lower():
                              res.append("%s=%s"%(p+'/'+str(k), str(v)[:200]))
                          res+=findver(v,p+'/'+str(k))
                  elif isinstance(o,list):
                      for v in o: res+=findver(v,p)
                  return res
              vv=findver(j)
              if vv: print("  KEYS-WITH-version:", vv[:20])
              else: print("  no key named version found")
          except Exception as e:
              print("  parse err:", e)

          # 4) /api/me
          s4,h4,b4=fetch('GET','/api/me', token=tok)
          me=b4.decode('utf-8','replace')
          print("\n=== /api/me (guest): version substrings ===")
          for mm in re.finditer(r'.{0,30}version.{0,40}', me, re.I):
              print("  %r" % mm.group(0)[:120])

          print("\nDONE")
          PYEOF
