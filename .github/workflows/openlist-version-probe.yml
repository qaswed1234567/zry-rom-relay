name: openlist-version-probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: OpenList version fingerprint (read-only)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json, hashlib, base64
          from urllib.parse import urljoin
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(method, path, body=None, token=None):
              url=base+path
              h={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':base,'Referer':base+'/'}
              if token: h['Authorization']=token
              data=None
              if body is not None: data=json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  r=urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, dict(r.getheaders()), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return -1, {}, ('ERR:'+repr(e)).encode()
          def jd(b):
              try: return json.loads(b.decode('utf-8','replace'))
              except: return None
          def sha256(b): return hashlib.sha256(b).hexdigest()
          def md5(b): return hashlib.md5(b).hexdigest()

          print("========== TARGET: %s ==========" % base)
          print("MY_IP_CHECK:")
          try:
              r=urllib.request.urlopen("https://api.ipify.org", timeout=15, context=ctx).read().decode()
              print("  relay_egress_ip=%s" % r)
          except Exception as e:
              print("  ipify_err=%s" % repr(e))

          # 1) index page
          s,h,b=fetch('GET','/')
          txt=b.decode('utf-8','replace')
          print("\n===== INDEX (status=%s) =====" % s)
          print("HEADERS:")
          for k,v in h.items(): print("  %s: %s" % (k,v))
          print("META/title:")
          for m in re.findall(r'<meta[^>]+>', txt, re.I)[:30]: print("  %s" % m)
          t=re.search(r'<title>(.*?)</title>', txt, re.S|re.I)
          if t: print("  <title>%s</title>" % t.group(1).strip())
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', txt, re.I)
          print("SCRIPT_REFS(%d):" % len(scripts))
          for sc in scripts: print("  %s" % sc)

          # 2) download scripts -> hash + grep version
          print("\n===== SCRIPT HASHES / VERSION GREP =====")
          alljs=bytearray()
          for i,sc in enumerate(scripts):
              u=urljoin(base+"/", sc)
              s2,h2,b2=fetch('GET', u.replace(base,''))
              if s2>=400 or not b2:
                  print("  SKIP %s (status=%s len=%s)" % (u,s2,len(b2)))
                  continue
              alljs+=b2
              print("  [%d] %s status=%s sha256=%s md5=%s len=%d" % (i,u,s2,sha256(b2)[:16],md5(b2)[:12],len(b2)))

          # 3) /api/version (alist/openlist canonical)
          print("\n===== /api/version =====")
          for ep in ['/api/version','/api/public/settings','/api/me','/api/auth/login']:
              s3,h3,b3=fetch('GET', ep)
              d=jd(b3)
              print("--- %s status=%s ---" % (ep,s3))
              print(json.dumps(d, ensure_ascii=False)[:800] if d is not None else ("  raw=%r" % b3[:300]))
              if ep=='/api/auth/login':
                  # also try guest login to capture any version in payload
                  s4,h4,b4=fetch('POST','/api/auth/login', body={'username':'guest','password':'guest'})
                  d4=jd(b4)
                  print("  guest_login status=%s" % s4)
                  print("  guest_login_body=%s" % (json.dumps(d4, ensure_ascii=False)[:400] if d4 else repr(b4[:200])))

          # 4) grep all captured JS for version fingerprints
          jst=alljs.decode('utf-8','replace')
          print("\n===== VERSION FINGERPRINT GREP (in JS bundles) =====")
          patterns={
            'semver': r'\b\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?\b',
            'version_kv': r'(?:version|VERSION|Version|appVersion|buildVersion|__VERSION__|APP_VERSION|VITE_APP_VERSION)\s*[:=]\s*["\'][^"\']{1,40}["\']',
            'commit': r'(?:commit|COMMIT|commitId|gitHash|buildCommit)\s*[:=]\s*["\'][0-9a-f]{6,40}["\']',
            'build_time': r'(?:buildTime|buildDate|BUILD_TIME|releaseDate)\s*[:=]\s*["\'][^"\']{4,40}["\']',
            'openlist_brand': r'(?:OpenList|openlist|Alist|alist)[\s"\'/:]{0,4}\d+\.\d+',
          }
          for name,pat in patterns.items():
              seen=set()
              for m in re.findall(pat, jst):
                  if isinstance(m,tuple): m=''.join(m)
                  seen.add(m)
              if seen:
                  print("  [%s] %s" % (name, ' | '.join(sorted(seen)[:25])))
          # also search HEAD of each script for banner comments
          print("\n===== DONE =====")
          PYEOF
