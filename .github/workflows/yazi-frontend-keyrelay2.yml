name: yazi-frontend-keyrelay2
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'base url'
        required: false
        default: 'https://yazinb.icu'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch frontend and capture everything
        run: |
          set -e
          BASE="${{ github.event.inputs.target }}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p out
          echo "===== INDEX ====="
          curl -sk -A "$UA" -o out/index.html "$BASE/"
          echo "index bytes: $(wc -c < out/index.html)"
          echo "----- ALL url-like references in index (script/link/import/src/href/url) -----"
          grep -oE "(src|href)=['\"][^'\"]+['\"]" out/index.html | sort -u | tee out/refs.txt
          grep -oE "(import|from|require)\s*\(?\s*['\"][^'\"]+['\"]" out/index.html | sort -u | tee -a out/refs.txt
          grep -oE "url\(['\"]?[^)'\"]+" out/index.html | sort -u | tee -a out/refs.txt
          echo "----- any /svc or /api or admin mentions -----"
          grep -ioE "(/svc/[a-zA-Z0-9_/-]+|/api/[a-zA-Z0-9_/-]+|admin|adminkey|admin_key)" out/index.html | sort | uniq -c | tee out/svc_mentions.txt
          echo "===== fetch referenced JS/CSS/HTML ====="
          idx=0
          while read -r raw; do
            s=$(echo "$raw" | sed -E "s/.*=\s*['\"]([^'\"]+)['\"].*/\1/; s/url\(\s*['\"]?([^)'\"]+).*/\1/")
            case "$s" in
              /*) u="$BASE$s" ;;
              http*) u="$s" ;;
              //*) u="https:$s" ;;
              *) u="$BASE/${s#./}" ;;
            esac
            ext="${s##*.}"
            fn="out/res_$(printf '%02d' $idx).${ext:-bin}"
            curl -sk -A "$UA" -o "$fn" "$u" || true
            echo "FETCHED $u -> $fn ($(wc -c < "$fn" 2>/dev/null) bytes)"
            idx=$((idx+1))
          done < out/refs.txt
          echo "===== grep all captured files for key material ====="
          for f in out/res_* out/index.html; do
            echo "##### $f #####"
            grep -ioE "(admin[_-]?key|adminkey|/svc/admin|apikey|api_key|secret|token|password|passwd|salt|nonce|md5|sha[0-9]|key\s*[:=]\s*['\"][^'\"]{4,}|const [A-Za-z]*[Kk]ey\s*=|let [A-Za-z]*[Kk]ey\s*=)" "$f" 2>/dev/null | sort | uniq -c | head -50
          done | tee out/grep_all.txt
          echo "===== DONE ====="
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: yazi-capture
          path: out/
          if-no-files-found: warn