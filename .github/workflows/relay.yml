name: zry-rom-relay

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'rom base URL to capture'
        required: false
        default: 'https://zryflash.cn/rom/'

permissions:
  contents: write
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe + capture from GitHub cloud network
        run: |
          set -e
          mkdir -p out
          python3 - <<'PYEOF'
          import urllib.request, ssl, re, os, json
          from urllib.parse import urljoin
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          base = "${{ github.event.inputs.target }}"
          def fetch(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml,application/javascript,*/*;q=0.8',
                  'Referer': base})
              try:
                  r = urllib.request.urlopen(req, timeout=30, context=ctx)
                  return r.status, dict(r.getheaders()), r.read()
              except Exception as e:
                  return None, {'error': str(e)}, b''
          os.makedirs('out', exist_ok=True)
          status, headers, body = fetch(base)
          with open('out/rom.headers.txt','w',encoding='utf-8',errors='replace') as f:
              f.write('STATUS %s\n' % status)
              for k,v in headers.items():
                  f.write('%s: %s\n' % (k,v))
          with open('out/rom.html','wb') as f:
              f.write(body)
          text = body.decode('utf-8','replace')
          srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I)
          css  = re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)["\']', text, re.I)
          print('PAGE_STATUS', status)
          print('SCRIPTS', json.dumps(srcs))
          apihosts=set()
          for i,s in enumerate(srcs):
              u = urljoin(base, s)
              st,h,b = fetch(u)
              fn = 'out/script_%02d.js' % i
              with open(fn,'wb') as f: f.write(b)
              with open(fn+'.headers.txt','w',encoding='utf-8',errors='replace') as f:
                  f.write('URL %s\nSTATUS %s\n' % (u,st))
                  for k,v in h.items(): f.write('%s: %s\n'%(k,v))
              txt=b.decode('utf-8','replace')
              for m in re.findall(r'https?://[a-zA-Z0-9_.\-]+(?::\d+)?(?:/[^\s"\'<>(){}]*)?', txt):
                  apihosts.add(m)
              print('FETCHED', u, st, len(b))
          dom = urljoin(base,'/')
          for p in ['web-api/','api/','rom/web-api/','zryroot/','webapi/','admin/','backend/']:
              u = urljoin(dom,p)
              st,h,b=fetch(u)
              with open('out/probe_'+p.replace('/','_')+'.txt','w',encoding='utf-8',errors='replace') as f:
                  f.write('URL %s\nSTATUS %s\n' % (u,st))
                  for k,v in h.items(): f.write('%s: %s\n'%(k,v))
                  f.write('\n'+b.decode('utf-8','replace')[:20000])
              print('PROBE', u, st)
          with open('out/candidate_urls.txt','w',encoding='utf-8') as f:
              for u in sorted(apihosts): f.write(u+'\n')
          print('CANDIDATE_URLS_COUNT', len(apihosts))
          PYEOF

      - name: Upload full capture as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zry-rom-capture
          path: out/
          if-no-files-found: warn

      - name: Publish gist + issue summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          {
            echo "# zryflash.cn/rom capture (GitHub Actions relay)"
            echo ""
            echo "## rom page response headers"; cat out/rom.headers.txt
            echo ""; echo "## candidate URLs extracted from JS"; cat out/candidate_urls.txt
          } > report.md
          gh gist create out/rom.html out/rom.headers.txt out/candidate_urls.txt $(ls out/script_*.js 2>/dev/null) --public -d "zry rom capture" > gist_out.txt || true
          echo "GIST_RESULT:"; cat gist_out.txt
          gh issue create --title "zry rom relay capture" --body "$(cat report.md)" || true
