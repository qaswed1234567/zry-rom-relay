name: yazi-frontend-keyrelay
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'base url'
        required: false
        default: 'https://yazinb.icu'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch frontend and hunt for admin key
        run: |
          set -e
          BASE="${{ github.event.inputs.target }}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p out
          echo "===== INDEX $BASE ====="
          curl -sk -A "$UA" -o out/index.html "$BASE/" || true
          ls -l out/index.html
          echo "----- script srcs in index -----"
          grep -oE 'src="[^"]+\.js[^"]*"' out/index.html | head -50 | tee out/scripts.txt
          echo "----- inline key/admin/svc mentions in index -----"
          grep -ioE '(admin[_-]?key|/svc/admin|apikey|api_key|secret|token|pwd|password)\b' out/index.html | sort | uniq -c | tee out/idx_mentions.txt
          echo "===== fetch each JS and scan ====="
          idx=0
          while read -r line; do
            s=$(echo "$line" | sed -E 's/src="([^"]+)"/\1/')
            case "$s" in
              /*) u="$BASE$s" ;;
              http*) u="$s" ;;
              *) u="$BASE/${s#./}" ;;
            esac
            fn="out/js_$(printf '%02d' $idx).js"
            curl -sk -A "$UA" -o "$fn" "$u" || true
            echo "FETCHED $u -> $fn ($(wc -c < "$fn" 2>/dev/null) bytes)"
            echo "----- matches in $fn -----"
            grep -ioE '(admin[_-]?key|/svc/admin|apikey|api_key|secret|token|pwd|password|key\s*[:=]|const [A-Za-z]*[Kk]ey)' "$fn" 2>/dev/null | sort | uniq -c | head -40
            idx=$((idx+1))
          done < out/scripts.txt
          echo "===== /svc/admin/key benign probe (no key) ====="
          curl -sk -A "$UA" -o out/key_probe.txt -w "HTTP %{http_code}\n" -X POST "$BASE/svc/admin/key" -H "Content-Type: application/json" -d '{}' || true
          cat out/key_probe.txt | head -20
          echo "===== DONE ====="