name: openlist-config

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenList base URL'
        required: false
        default: 'https://pan.yazinb.icu'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.target }}
    steps:
      - name: Dump window.OPENLIST_CONFIG and grep version
        run: |
          python3 - <<'PYEOF'
          import urllib.request, ssl, re
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          base=os.environ['BASE'].rstrip('/')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          req=urllib.request.Request(base+'/', headers={'User-Agent':UA})
          idx=urllib.request.urlopen(req, timeout=30, context=ctx).read().decode('utf-8','replace')
          m=re.search(r'window\.OPENLIST_CONFIG\s*=\s*(\{.*?\});', idx, re.S)
          if m:
              cfg=m.group(1)
              print("=== OPENLIST_CONFIG full ===")
              print(cfg[:1500])
              print("=== version-ish in config ===")
              for mm in re.finditer(r'.{0,20}(version|Version).{0,40}', cfg):
                  print("  %r" % mm.group(0)[:120])
          else:
              print("OPENLIST_CONFIG not found")
          # also dump any /assets/index js and grep for a build version constant
          import json
          print("=== title ===", re.search(r'<title>(.*?)</title>', idx).group(1) if re.search(r'<title>(.*?)</title>',idx) else None)
          print("DONE")
          PYEOF
