name: ssh-key-login-probe-n

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'target host:port'
        required: false
        default: '119.28.135.153:22'
      users:
        description: 'space-separated candidate users (keep small: ~2 to avoid fail2ban ban)'
        required: false
        default: 'root'
      users_b64:
        description: 'optional base64(utf-8) of space-separated users; if set, overrides users (encoding-safe for CJK)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ssh-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Key login attempt for given users
        run: |
          set -e
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"

          KEY_B64=""
          echo "$KEY_B64" | base64 -d > "$HOME/.ssh/ff_server_20261110"
          chmod 600 "$HOME/.ssh/ff_server_20261110"
          which ssh || (sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client)

          TARGET="${{ github.event.inputs.target }}"
          HOST="${TARGET%:*}"; PORT="${TARGET##*:}"; [ "$PORT" = "$TARGET" ] && PORT=22
          echo "=== TARGET=$HOST PORT=$PORT ==="

          USERS_INPUT="${{ github.event.inputs.users }}"
          if [ -n "${{ github.event.inputs.users_b64 }}" ]; then
            USERS_INPUT=$(printf '%s' "${{ github.event.inputs.users_b64 }}" | base64 -d)
          fi
          echo "USERS_INPUT=[$USERS_INPUT]"

          mkdir -p out; : > out/results.txt; SUCCESS_USER=""
          for u in $USERS_INPUT; do
            echo "----- trying user=$u -----" | tee -a out/results.txt
            outfile="out/login_${u}.txt"
            code=0
            ssh -i "$HOME/.ssh/ff_server_20261110" -p "$PORT" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o BatchMode=yes -o ConnectTimeout=15 -o PreferredAuthentications=publickey \
                -o PasswordAuthentication=no -o NumberOfPasswordPrompts=0 \
                "$u@$HOST" \
                'echo LOGIN_OK; id; whoami; uname -a; hostname; cat /etc/os-release 2>/dev/null | head -3; echo "---SUDO-N---"; sudo -n -l 2>&1 | head -20' \
                > "$outfile" 2>&1 || code=$?
            echo "exit_code=$code" | tee -a out/results.txt
            if [ "$code" -eq 0 ] && grep -q LOGIN_OK "$outfile"; then
              echo ">>> SUCCESS as $u" | tee -a out/results.txt
              SUCCESS_USER="$u"; cp "$outfile" out/SUCCESS.txt; break
            fi
            echo "last lines:"; tail -3 "$outfile" | tee -a out/results.txt
            sleep 5
          done

          if [ -n "$SUCCESS_USER" ]; then
            echo "FINAL: AUTHENTICATED_AS=$SUCCESS_USER" | tee -a out/results.txt
          else
            echo "FINAL: NO_KEY_AUTH_SUCCESS" | tee -a out/results.txt
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-login-results-n
          path: out/
          if-no-files-found: warn
